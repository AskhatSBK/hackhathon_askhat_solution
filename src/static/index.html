<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qazcode — Клинический помощник</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a2a3a;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0a4275 0%, #1565c0 100%);
      color: #fff;
      padding: 1.5rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.5px; }
    header p { font-size: 0.9rem; opacity: 0.8; margin-top: 0.25rem; }

    main {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #0a4275;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 2px solid #c7d8ea;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      resize: vertical;
      transition: border-color 0.2s;
      font-family: inherit;
      line-height: 1.6;
    }
    textarea:focus {
      outline: none;
      border-color: #1565c0;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1565c0;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #0d47a1; }
    button:active { transform: scale(0.97); }
    button:disabled { background: #90a4ae; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: none; }

    .results-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0a4275;
      margin-bottom: 1rem;
    }

    .diagnosis-card {
      border: 1px solid #e0eaf4;
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 0.9rem;
      background: #f7fbff;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .diagnosis-card:first-child {
      border-color: #1565c0;
      background: #e8f0fe;
    }

    .rank-badge {
      background: #1565c0;
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .diagnosis-card:first-child .rank-badge { background: #0a2f6b; }

    .diagnosis-content { flex: 1; }

    .diagnosis-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #0a2f6b;
      margin-bottom: 0.3rem;
    }

    .icd-badge {
      display: inline-block;
      background: #1565c0;
      color: #fff;
      border-radius: 4px;
      padding: 0.15rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }
    .diagnosis-card:first-child .icd-badge { background: #0a2f6b; }

    .diagnosis-explanation {
      font-size: 0.92rem;
      color: #2c4a6a;
      line-height: 1.6;
    }

    .error-box {
      background: #fff3f3;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: #721c24;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #607d8b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Клинический помощник по протоколам Казахстана</h1>
    <p>Введите симптомы пациента — система предложит вероятные диагнозы с кодами МКБ-10</p>
  </header>

  <main>
    <div class="card">
      <label for="symptoms">Описание симптомов пациента</label>
      <textarea
        id="symptoms"
        placeholder="Опишите симптомы пациента на русском или казахском языке..."
      ></textarea>
      <button id="submitBtn" onclick="diagnose()">
        <span class="spinner" id="spinner"></span>
        Диагностировать
      </button>
    </div>

    <div id="results" class="card">
      <div class="results-title" id="resultsTitle">Результаты диагностики</div>
      <div id="diagnosisList"></div>
    </div>
  </main>

  <footer>Qazcode &mdash; DataSaur 2026 &bull; Клинические протоколы РК</footer>

  <script>
    async function diagnose() {
      const symptoms = document.getElementById("symptoms").value.trim();
      if (!symptoms) {
        alert("Пожалуйста, введите симптомы пациента.");
        return;
      }

      const btn = document.getElementById("submitBtn");
      const spinner = document.getElementById("spinner");
      const results = document.getElementById("results");
      const list = document.getElementById("diagnosisList");
      const title = document.getElementById("resultsTitle");

      btn.disabled = true;
      spinner.style.display = "block";
      results.style.display = "none";
      list.innerHTML = "";

      try {
        const res = await fetch("/diagnose", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symptoms }),
        });

        if (!res.ok) {
          throw new Error(`Ошибка сервера: ${res.status}`);
        }

        const data = await res.json();
        const diagnoses = data.diagnoses || [];

        title.textContent = `Результаты диагностики (${diagnoses.length} вариантов)`;

        if (diagnoses.length === 0) {
          list.innerHTML = '<div class="error-box">Диагнозы не найдены. Попробуйте описать симптомы подробнее.</div>';
        } else {
          const sorted = [...diagnoses].sort((a, b) => a.rank - b.rank);
          list.innerHTML = sorted.map(d => `
            <div class="diagnosis-card">
              <div class="rank-badge">${d.rank}</div>
              <div class="diagnosis-content">
                <div class="diagnosis-name">${escHtml(d.diagnosis)}</div>
                <div><span class="icd-badge">МКБ-10: ${escHtml(d.icd10_code)}</span></div>
                <div class="diagnosis-explanation">${escHtml(d.explanation)}</div>
              </div>
            </div>
          `).join("");
        }

        results.style.display = "block";

      } catch (err) {
        list.innerHTML = `<div class="error-box">Ошибка: ${escHtml(err.message)}</div>`;
        results.style.display = "block";
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Submit on Ctrl+Enter
    document.getElementById("symptoms").addEventListener("keydown", e => {
      if (e.key === "Enter" && e.ctrlKey) diagnose();
    });
  </script>
</body>
</html>
